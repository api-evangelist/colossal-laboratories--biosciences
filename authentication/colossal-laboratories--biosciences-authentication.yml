observations:
- finding: anonymous user enumeration
  detail: >-
    GET /wp/v2/users returns all 8 contributor accounts — display name, slug and public
    author-archive URL — with no credentials. This is default WordPress behaviour rather than a
    Colossal decision, but it is the standard first step of a WordPress credential-stuffing
    attempt and is worth Colossal's attention. API Evangelist records the shape and count only
    and does not republish the identities.
  status: 200
- finding: no vulnerability-disclosure channel
  detail: >-
    /.well-known/security.txt and /security.txt both 404, and no bug-bounty or disclosure page
    exists, so there is no published route to report the item above. See
    security/colossal-laboratories--biosciences-domain-security.yml.
  status: 404
