schemes:
- name: applicationPassword
  type: http
  scheme: basic
  description: >-
    WordPress Application Passwords, advertised by the site at https://colossal.com/wp-json/
    under authentication.application-passwords; authorization endpoint
    https://colossal.com/wp-admin/authorize-application.php. Read operations on wp/v2 are
    anonymous.
  applies_to: every create / replace / update / delete operation in the derived OpenAPI
  issuance: >-
    Self-service only for accounts that already hold a colossal.com WordPress login. No third
    party can obtain one, so in practice this API is read-only to everyone outside Colossal.
  sources:
