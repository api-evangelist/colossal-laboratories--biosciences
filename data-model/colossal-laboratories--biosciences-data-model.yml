id_conventions:
  scheme: integer auto-increment, shared across posts, pages and attachments (one wp_posts table)
  note: >-
    There are no prefixed or namespaced identifiers. A numeric id is only meaningful together
    with its collection, and `search` results carry `subtype` for exactly that reason.
  slugs: >-
    Every post, page and term also carries a URL slug, which is the stable human handle and the
    safer join key across the sitemap, the RSS feed and the REST API.
not_modeled:
  note: >-
    Five custom post types are published on colossal.com and listed in the Rank Math sitemap
    index — `paper` (scientific papers), `podcast`, `team`, `faq` and `pdf` — but none is
    registered with the REST API, so none has an entity, a schema or an endpoint here. They are
    reachable only as rendered HTML. This is the largest missing piece of Colossal's own data
    model from a machine's point of view.
