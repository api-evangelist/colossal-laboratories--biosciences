- path: /robots.txt
  status: 200
  content_type: text/plain
  note: >-
    Three directives only — Disallow /wp-admin/, Allow /wp-admin/admin-ajax.php, Crawl-delay 10
    — plus the sitemap pointer. No AI crawler is named, neither allowed nor blocked, so the
    wildcard User-agent rule is what governs GPTBot, ClaudeBot, PerplexityBot and the rest.
- path: /sitemap_index.xml
