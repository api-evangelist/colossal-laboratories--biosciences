adjacent_discovery_found:
- path: /wp-json/
  status: 200
  content_type: application/json
  note: The WordPress REST route-discovery document — 308 routes across 18 namespaces. This is the only
    real machine-readable contract on colossal.com and is the source the OpenAPI in openapi/ was derived
    from. Saved verbatim at openapi/_source/colossal-laboratories--biosciences-wp-json-root.json.
- path: /wp-json/mcp
  status: 200
  content_type: application/json
  note: MCP namespace index. Advertises /wp-json/mcp/mcp-adapter-default-server. The server itself is
    401 to anonymous JSON-RPC. See mcp/colossal-laboratories--biosciences-mcp.yml.
- path: /robots.txt
  status: 200
  content_type: text/plain
  note: Three directives only — Disallow /wp-admin/, Allow /wp-admin/admin-ajax.php, Crawl-delay 10 —
    plus the sitemap pointer. No AI crawler is named, neither allowed nor blocked, so the wildcard User-agent
    rule is what governs GPTBot, ClaudeBot, PerplexityBot and the rest.
- path: /sitemap_index.xml
  status: 200
  content_type: text/xml
  note: Rank Math sitemap index — post, page, paper, podcast, team, pdf, faq, faq-category and local sitemaps.
    Note that paper, podcast, team, faq and pdf are custom post types that appear in the sitemap but are
    NOT registered with the REST API, so they cannot be read as JSON.
- path: /feed/
  status: 200
  content_type: application/rss+xml
  note: Site-wide RSS feed. Wired as BlogRSS.
