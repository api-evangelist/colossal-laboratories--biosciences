source: live GET probes of the /.well-known/ surface on every colossal.com host, 2026-08-09
host: https://colossal.com
note: 'Colossal serves no /.well-known/ discovery document at all. Every RFC 8615 path below returned
  a 404 — /llms.txt and /.well-known/security.txt return the small WordPress 404 page, the rest return
  the full themed 404 page (~70KB of text/html). Both agent-card paths 404 on the apex and 301 to the
  apex on www. Recorded as observed; absence is valid data and nothing was authored on Colossal''s behalf.


  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
hosts_probed:
- host: colossal.com
  resolves: true
  note: apex, canonical — WP Engine origin behind Cloudflare
- host: www.colossal.com
  resolves: true
  note: 301 redirects to the apex
- host: api.colossal.com
  resolves: true
  note: Resolves only because colossal.com carries a wildcard A record to the WP Engine edge (141.193.213.10/.11).
    There is no vhost — TLS handshake fails (sslv3 alert handshake failure) and plain HTTP returns 409,
    WP Engine's "no site for this hostname". Not an API host. The same is true of docs., developer., dev.,
    shop. and store.colossal.com.
- host: docs.colossal.com
  resolves: true
  note: wildcard DNS only; HTTPS handshake failure, HTTP 409 — no site
