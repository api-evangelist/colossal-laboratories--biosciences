aid: colossal-laboratories--biosciences
name: Colossal Laboratories & Biosciences
description: 'Colossal Laboratories & Biosciences (Colossal Biosciences) is a Dallas, Texas based
  genetic-engineering and de-extinction company founded in 2021 by entrepreneur Ben Lamm and Harvard
  geneticist Dr. George Church. It applies ancient-DNA sequencing, comparative genomics, CRISPR
  multiplex gene editing, cellular engineering and artificial-womb research to functional de-extinction
  and endangered-species conservation, with active programs on the woolly mammoth, thylacine, dodo,
  dire wolf, moa and bluebuck, plus the Colossal Biovault biobanking program and an EEHV vaccine
  effort for elephants. The company has raised roughly $435M through a $200M Series C in January 2025,
  spun out Form Bio (computational biology software) and Breaking (plastic degradation), and funds the
  nonprofit Colossal Foundation. Colossal publishes no product or developer API, no developer portal
  and no OpenAPI of its own; the machine-readable surface on colossal.com is the WordPress REST API
  (wp/v2) that serves the newsroom, science and species content, media library and site search as
  JSON, alongside a WordPress MCP Adapter endpoint that is present in the route index but
  authentication-gated. No first-party GitHub organization, SDK, package or /llms.txt was found.'
