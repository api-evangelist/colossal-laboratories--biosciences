unreachable_content:
  note: >-
    Recorded so a later round does not re-hunt it. Five custom post types are published on
    colossal.com and appear in the Rank Math sitemap index — `paper` (scientific papers),
    `podcast`, `team`, `faq` and `pdf` — but none is registered with the REST API
    (show_in_rest false), so none appears in /wp-json/ and none can be read as JSON by any
    agent or crawler. This is the single largest machine-readability gap on the site and it is
    Colossal's to close: registering those post types with the REST API would expose the
    company's papers, team and FAQ corpus without any new engineering.
